name: Probe macOS runners
on:
  push:
    paths:
      - '.github/workflows/probe.yml'
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Environment
        run: |
          set -x
          sw_vers
          uname -m
          xcodebuild -version
          xcode-select -p
          ls -d /Applications/Xcode* || true
          for x in /Applications/Xcode*.app; do echo "== $x"; "$x/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null | head -2; "$x/Contents/Developer/usr/bin/xcodebuild" -showsdks 2>/dev/null | grep -i iphone; done
          swift --version
          which xcodegen || echo "no xcodegen"
          brew --version | head -1
          xcrun simctl list runtimes
          xcrun simctl list devices available | head -60
          df -h /
      - name: Make artifact
        run: |
          mkdir -p out && echo "hello from ${{ matrix.os }}" > out/hello.txt
      - uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.os }}
          path: out/
          retention-days: 3
