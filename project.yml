name: RenewedMind
options:
  bundleIdPrefix: com.renewedmind
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  RenewedMindKit:
    path: Packages/RenewedMindKit
targets:
  RenewedMind:
    type: application
    platform: iOS
    sources:
      - path: RenewedMind
    dependencies:
      - package: RenewedMindKit
        product: RenewedMindKit
    info:
      path: RenewedMind/Info.plist
      properties:
        CFBundleDisplayName: Renewed Mind
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSApplicationQueriesSchemes:
          - tel
          - sms
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.renewedmind.app
        PRODUCT_NAME: RenewedMind
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        OTHER_LDFLAGS: ["$(inherited)", "-weak_framework", "FoundationModels"]
  RenewedMindUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RenewedMindUITests
    dependencies:
      - target: RenewedMind
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.renewedmind.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RenewedMind
schemes:
  RenewedMind:
    build:
      targets:
        RenewedMind: all
        RenewedMindUITests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: RenewedMindUITests
    archive:
      config: Release
